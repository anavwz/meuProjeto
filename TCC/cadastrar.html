<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar - Doe-se</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

    <div class="login-container">
        <h2>Criar Conta</h2>
        
        <form action="#">
            <div class="input-box">
                <ion-icon name="person-outline"></ion-icon>
                <input type="text" placeholder="Nome completo" required>
            </div>

            <div class="input-box">
                <ion-icon name="mail-outline"></ion-icon>
                <input type="email" placeholder="Seu e-mail" required>
            </div>

            <div class="input-box">
                <ion-icon name="call-outline"></ion-icon>
                <input type="tel" placeholder="Telefone / WhatsApp" required>
            </div>

            <div class="input-box">
                <ion-icon name="card-outline"></ion-icon>
                <input type="text" placeholder="CPF ou CNPJ" required>
            </div>

            <div class="input-box">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <input type="password" placeholder="Criar senha" required>
            </div>

            <div class="input-box">
                <ion-icon name="checkmark-circle-outline"></ion-icon>
                <input type="password" placeholder="Confirmar senha" required>
            </div>

            <button type="submit" class="btn-login">Finalizar Cadastro</button>
        </form>

        <div class="login-footer">
            <p style="font-size: 14px; color: #555; margin-bottom: 10px;">Já tem conta? <a href="login.html">Entrar</a></p>
            <a href="intro.html">← Voltar para o início</a>
        </div>
    </div>

</body>
</html>
