<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar - Doe-se</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

   <div class="login-container">

<h2>Criar Conta</h2>

<form id="formCadastro">

<div class="input-box">
<input type="text" id="nome" placeholder="Nome Completo" required>
</div>

<div class="input-box">
<input type="email" id="email" placeholder="E-mail" required>
</div>

<div class="linha">

<div class="input-box">
<input type="tel" id="telefone" placeholder="Telefone">
</div>

<div class="input-box">
<input type="text" id="cpf" placeholder="CPF">
</div>

</div>

<div class="linha">

<div class="input-box">
<input type="text" id="cep" placeholder="CEP">
</div>

<div class="input-box">
<input type="text" id="cidade" placeholder="Cidade">
</div>

</div>

<div class="linha">

<div class="input-box">
<input type="text" id="estado" placeholder="UF">
</div>

<div class="input-box">
<input type="text" id="bairro" placeholder="Bairro">
</div>

</div>

<div class="input-box">
<input type="text" id="endereco" placeholder="Rua">
</div>

<div class="linha">

<div class="input-box">
<input type="text" id="numero" placeholder="Número">
</div>

<div class="input-box">
<input type="text" id="complemento" placeholder="Complemento">
</div>

</div>

<div class="linha">

<div class="input-box">
<input type="password" id="senha" placeholder="Senha">
</div>

<div class="input-box">
<input type="password" id="confirmarSenha" placeholder="Confirmar senha">
</div>

</div>

<div class="input-box">
<label>Foto de Perfil</label>
<input type="file" id="fotoPerfil" accept="image/*">
</div>

<div class="input-box">
<label>Documento (RG ou CNH)</label>
<input type="file" id="fotoDocumento" accept="image/*,.pdf">
</div>

<div class="termos">

<label>

<input type="checkbox" required>

Li e aceito os Termos de Uso

</label>

</div>

<button class="btn-login">
Criar Conta
</button>

</form>

</div>
</body>
</html>
