<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar - Doe-se</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

    <div class="login-container">
        <h2>Criar Conta</h2>
        
        <form id="formCadastro">
            <div class="input-box">
                <ion-icon name="person-outline"></ion-icon>
                <input type="text" id="nome" placeholder="Nome completo" required>
            </div>

            <div class="input-box">
                <ion-icon name="mail-outline"></ion-icon>
                <input type="email" id="email" placeholder="Seu e-mail" required>
            </div>

            <div class="input-box">
                <ion-icon name="call-outline"></ion-icon>
                <input type="tel" id="telefone" placeholder="Telefone / WhatsApp" required>
            </div>

            <div class="input-box">
                <ion-icon name="card-outline"></ion-icon>
                <input type="text" id="cpf" placeholder="CPF" required>
            </div>

            <div class="input-box">
                <ion-icon name="location-outline"></ion-icon>
                <input type="text" id="cidade" placeholder="Cidade" required>
            </div>

            <div class="input-box">
                <ion-icon name="map-outline"></ion-icon>
                <input type="text" id="bairro" placeholder="Bairro" required>
            </div>

            <div class="input-box">
                <ion-icon name="home-outline"></ion-icon>
                <input type="text" id="endereco" placeholder="Endereço / Rua e Número" required>
            </div>

            <div class="input-box">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <input type="password" id="senha" placeholder="Criar senha" required>
            </div>

            <div class="input-box">
                <ion-icon name="checkmark-circle-outline"></ion-icon>
                <input type="password" id="confirmarSenha" placeholder="Confirmar senha" required>
            </div>

            <button type="submit" class="btn-login" id="btnSubmit">Finalizar Cadastro</button>
        </form>

        <div class="login-footer">
            <p style="font-size: 14px; color: #555; margin-bottom: 10px;">Já tem conta? <a href="login.html">Entrar</a></p>
            <a href="intro.html">← Voltar para o início</a>
        </div>
    </div>

    <script>
        const formCadastro = document.getElementById('formCadastro');

        formCadastro.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const telefone = document.getElementById('telefone').value;
            const cpf = document.getElementById('cpf').value;
            const cidade = document.getElementById('cidade').value;
            const bairro = document.getElementById('bairro').value;
            const endereco = document.getElementById('endereco').value;
            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;

            if (senha !== confirmarSenha) {
                alert('As senhas não coincidem!');
                return;
            }

            const usuarioDados = {
                nome,
                email,
                telefone,
                cpf,
                cidade,
                bairro,
                endereco,
                senha
            };

            try {
                // Rota padronizada do back-end
                const response = await fetch('http://localhost:3000/usuarios', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(usuarioDados)
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.mensagem || 'Usuário cadastrado com sucesso!');
                    window.location.href = 'login.html';
                } else {
                    alert(data.mensagem || 'Erro ao realizar cadastro.');
                }

            } catch (error) {
                console.error('Erro na requisição:', error);
                alert('Não foi possível conectar ao servidor. Verifique se o Back-end está rodando em http://localhost:3000');
            }
        });
    </script>
</body>
</html>
